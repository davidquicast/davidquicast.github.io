name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links-on-site:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Match the workspace owner
        run: |
          echo "PORTFOLIO_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "PORTFOLIO_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build the Docker environment
        run: docker compose build
      - name: Build and verify local links in the deployed source
        run: docker compose run --rm --no-deps jekyll bash bin/build-production.sh
