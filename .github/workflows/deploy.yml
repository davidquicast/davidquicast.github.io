name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages-production
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/verify.yml
    with:
      publish_artifact: true
      refresh_activity: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
