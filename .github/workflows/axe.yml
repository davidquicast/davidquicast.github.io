name: Axe accessibility testing

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Local portfolio path to audit, for example /blog/"
        required: false
        default: "/"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Match the workspace owner
        run: |
          echo "PORTFOLIO_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "PORTFOLIO_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build the Docker environment
        run: docker compose build
      - name: Build and verify production
        run: docker compose run --rm --no-deps jekyll bash bin/build-production.sh
      - name: Audit the built page in Chromium
        env:
          AUDIT_PATH: ${{ inputs.url }}
        run: docker compose run --rm --no-deps -e AUDIT_PATH jekyll node tools/audit-accessibility.cjs
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-accessibility
          path: .local/redesign/evidence/accessibility-production.json
          if-no-files-found: ignore
