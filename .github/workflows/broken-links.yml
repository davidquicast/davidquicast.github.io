name: Check external links

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Match the workspace owner
        run: |
          echo "PORTFOLIO_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "PORTFOLIO_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build the Docker environment
        run: docker compose build
      - name: Build and verify local destinations
        run: docker compose run --rm --no-deps jekyll bash bin/build-production.sh
      - name: Check external links from published HTML
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: true
          args: >-
            --verbose --no-progress
            --base https://davidquicast.github.io
            --exclude '^https://davidquicast\.github\.io'
            --exclude-path .local/production/assets
            '.local/production/**/*.html'
