name: Prettier code formatter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Match the workspace owner
        run: |
          echo "PORTFOLIO_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "PORTFOLIO_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build the Docker environment
        run: docker compose build
      - name: Check locked formatting rules
        run: docker compose run --rm --no-deps jekyll npx prettier . --check
