services:
  jekyll:
    build:
      context: .
      args:
        PORTFOLIO_UID: ${PORTFOLIO_UID:-1000}
        PORTFOLIO_GID: ${PORTFOLIO_GID:-1000}
    image: davidquicast-portfolio:development
    restart: unless-stopped
    ports:
      - "${PORTFOLIO_BIND_ADDRESS:-127.0.0.1}:8080:8080"
      - "${PORTFOLIO_BIND_ADDRESS:-127.0.0.1}:35729:35729"
    volumes:
      - .:/srv/jekyll
      - node_modules:/srv/jekyll/node_modules
      - bundle:/usr/local/bundle
      - design_skills:/home/portfolio/.codex/skills
    environment:
      PORTFOLIO_FORCE_POLLING: ${PORTFOLIO_FORCE_POLLING:-false}
      JEKYLL_ENV: development
      JEKYLL_PREVIEW_DRAFTS: ${JEKYLL_PREVIEW_DRAFTS:-true}
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5

volumes:
  node_modules:
  bundle:
  design_skills:
