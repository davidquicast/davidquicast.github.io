    language_short: "Spanish"
    description: "Empirical security evaluation testing whether third-party MCP tools can manipulate autonomous coding agents."
    summary: "An empirical security evaluation testing whether indirect prompt injections and altered tool parameters can manipulate autonomous coding agents like Google Antigravity, featuring live MCP telemetry and deterministic PreToolUse defenses."
    abstract: "Can third-party tools and MCP servers hosted across public registries manipulate autonomous coding agents? At GDG DevFest Cusco 2026, we presented an empirical security evaluation testing whether indirect prompt injections and altered tool parameters can redirect Google Antigravity. Evaluating Gemini Flash across controlled conditions, overt instructions to alter agent rules or recommend packages yielded 0/50 successes (with 1/50 test command executed in high effort). However, documentation-style contextual notes drifted package recommendations by 25%–40% (Wilson 95% CI: 14.5%–61.3%). End-to-end telemetry across 63 completed MCP calls verified 3 destination-confirmed canary exfiltrations. A deterministic PreToolUse policy intercepted and denied 100% (5/5) of unauthorized rule modification attempts."
    key_findings:
      - metric: "0 / 50"
        label: "Overt Package & Rule Injections"
        detail: "0/50 across low/medium/high effort for package recommendation and agent rules; 1/50 test command executed in high."
      - metric: "25% – 40%"
        label: "Contextual Note Drift Rate"
        detail: "Documentation notes achieved 30% (simple), 25% (tagged), and 40% (interleaved) recommendation drift versus 0% baseline (Wilson 95% CI)."
      - metric: "63 Calls / 3 Confirmed"
        label: "End-to-End MCP Audit Trace"
        detail: "63 completed MCP calls across 5 series verified 6 records and 3 destination-matched canary exfiltrations."
      - metric: "5 / 5 Denied (100%)"
        label: "PreToolUse Runtime Defense"
        detail: "Deterministic native PreToolUse policy intercepted and denied all 5 rule write attempts observed across 10 evaluation runs."
